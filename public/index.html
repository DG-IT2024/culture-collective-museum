<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Culture Collective</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1c1916; color: #f3ead8; font: 16px/1.5 Georgia, serif; }
  p { color: #c8a96a; font-family: system-ui, sans-serif; font-size: 14px; }
</style>
</head>
<body>
  <main>
    <h1>Culture Collective</h1>
    <p id="status">Phase 0 placeholder. The 3D museum is built in Phase 1.</p>
  </main>
  <script src="data.js"></script>
  <script>
    const d = window.CC_DATA;
    if (d) document.getElementById('status').textContent += ` Data loaded: ${d.rooms.reduce((n, r) => n + r.aspects.reduce((m, a) => m + a.items.length, 0), 0)} exhibits.`;
  </script>
</body>
</html>
